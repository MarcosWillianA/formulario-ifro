<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/styles.css">
    <title>Formulário de Cadastro</title>
</head>
<body>
    <main>
        <div id="container">
            <div id="sessao-logo" class="sessao">
                <img src="assets/img/logo-ifro.jpg" alt="Logo do IFRO">
            </div>
            <div id="sessao-formulario" class="sessao">
                <div id="topo">
                    <h1>Cadastre-se</h1>
                    <button>
                        Login
                    </button>
                </div>
                <form action="">
                    <div id="form-inputs">
                        <div class="label-input">
                            <label for="primeiro-nome">Primeiro nome</label>
                            <input type="text" name="primeiro-nome" id="primeiro-nome" class="caixas-de-texto" placeholder="Primeiro Nome">
                        </div>
                        <div class="label-input">
                            <label for="sobrenome">Sobrenome</label>
                            <input type="text" name="sobrenome" id="sobrenome" class="caixas-de-texto" placeholder="Sobrenome">
                        </div>
                        <div class="label-input">
                            <label for="email">Email</label>
                            <input type="email" name="email" id="email" class="caixas-de-texto" placeholder="Email">
                        </div>
                        <div class="label-input">
                            <label for="Celular">Celular</label>
                            <input type="tel" name="celular" id="celular" class="caixas-de-texto" placeholder="Celular">
                        </div>
                        <div class="label-input">
                            <label for="senha">Senha</label>
                            <input type="password" name="senha" id="senha" class="caixas-de-texto" placeholder="Senha">
                        </div>
                        <div class="label-input">
                            <label for="confirmar-senha">Confirme sua senha</label>
                            <input type="password" name="confirmar-senha" id="confirmar-senha" class="caixas-de-texto" placeholder="Confirme sua senha">
                        </div>
                    </div>
                    <h2>Gênero</h2>
                    <div id="input-radios">
                        <div class="label-radios">
                            <input type="radio" name="genero" id="feminino">
                            <label for="feminino">Feminino</label>
                        </div>
                        <div class="label-radios">
                            <input type="radio" name="genero" id="masculino">
                            <label for="masculino">Masculino</label>
                        </div>
                        <div class="label-radios">
                            <input type="radio" name="genero" id="outros">
                            <label for="outros">Outros</label>
                        </div>                        
                    </div>
                    <input type="submit" value="Cadastrar">
                </form>
            </div>
        </div>
    </main>
</body>
</html>
